name: SyncRulesets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rulesets from v2fly
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Rulesets/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync rulesets from v2fly"
            git push
          fi
